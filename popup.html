<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>X Archive Cleaner</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 360px; padding: 14px; margin: 0; }
    h1 { font-size: 18px; margin: 0 0 10px; }
    label { display:block; font-size:12px; margin:10px 0 4px; }
    input[type=text], input[type=number] { width:100%; box-sizing:border-box; padding:8px; }
    input[type=file] { width:100%; }
    .row { display:flex; gap:8px; margin-top:12px; }
    button { flex:1; padding:9px; cursor:pointer; }
    .danger { font-weight:700; }
    #status { margin-top:12px; padding:10px; background:#f3f3f3; border-radius:8px; white-space:pre-wrap; font-size:12px; }
    .small { font-size:11px; opacity:.75; line-height:1.35; margin-top:8px; }
  </style>
</head>
<body>
  <h1>X Archive Cleaner</h1>

  <label for="username">Your current X username</label>
  <input id="username" type="text" placeholder="@yourname" autocomplete="off">

  <label for="archiveFiles">Archive post file(s)</label>
  <input id="archiveFiles" type="file" multiple accept=".js,.json,text/javascript,application/json">

  <label for="delay">Delay between posts (milliseconds)</label>
  <input id="delay" type="number" min="1200" max="15000" step="100" value="2200">

  <label>
    <input id="dryRun" type="checkbox" checked>
    Dry run first (visit/verify without deleting)
  </label>

  <div class="row">
    <button id="importBtn">Import archive</button>
    <button id="startBtn" class="danger">Start / Resume</button>
  </div>
  <div class="row">
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset queue</button>
  </div>

  <div id="status">No archive imported.</div>
  <div class="small">
    Keep the X tab open while this runs. Start with Dry Run enabled to verify your username and archive first.
  </div>

  <script src="popup.js"></script>
</body>
</html>
